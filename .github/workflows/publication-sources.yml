name: Check official publication sources

on:
  schedule:
    - cron: '23 12 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/content/publications/**'
      - 'src/data/publication-sources.json'
      - 'scripts/check-publications.js'
      - 'scripts/publication-records.js'
      - '.github/workflows/publication-sources.yml'
  pull_request:
    paths:
      - 'src/content/publications/**'
      - 'src/data/publication-sources.json'
      - 'scripts/check-publications.js'
      - 'scripts/publication-records.js'
      - '.github/workflows/publication-sources.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser for public CERN metadata access
        run: pnpm exec playwright install --with-deps chromium
      - name: Compare abstracts, metadata, and versions with official sources
        run: pnpm publications:verify
      - name: Save source comparison report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-source-report
          path: publication-check.txt
          retention-days: 30
