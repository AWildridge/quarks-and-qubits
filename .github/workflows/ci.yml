name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate source and production build
        run: pnpm check
      - name: Verify current official paper versions before a full-site publication
        run: node scripts/check-publications.js --before-publish
      - name: Browser regression tests with production CSP
        run: pnpm test
      - name: Accessibility in light and dark themes
        run: pnpm a11y
      - name: Lighthouse quality gates
        run: pnpm lighthouse
      - name: Package verified site including Apache headers
        run: |
          node scripts/prepare-deployment.js
          tar -C dist-deploy -czf site-dist.tar.gz .
      - name: Upload verified site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-site-${{ github.sha }}
          path: site-dist.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 14
