name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=moderate
      - name: Install browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Validate source and production build
        run: pnpm check
      - name: Browser regression tests with production CSP
        run: pnpm test
      - name: Accessibility in light and dark themes
        run: pnpm a11y
      - name: Lighthouse quality gates
        run: pnpm lighthouse
      - name: Package verified site including Apache headers
        run: tar -C dist -czf site-dist.tar.gz .
      - name: Upload verified site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-site-${{ github.sha }}
          path: site-dist.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-reports-${{ github.run_id }}
          path: |
            .lighthouseci/
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 14
