name: Browser Data Refresh

on:
  schedule:
    - cron: '0 10 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Refresh browser data
        run: pnpm browser-data:update

      - name: Install browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Validate refreshed build data
        run: pnpm check && pnpm test && pnpm a11y && pnpm lighthouse && pnpm audit --audit-level=moderate

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: chore/refresh-browser-data
          commit-message: 'chore: refresh browser compatibility data'
          title: 'chore: refresh browser compatibility data'
          body: |
            Refreshes Baseline browser mapping and Browserslist/caniuse-lite data.

            This is generated by the monthly Browser Data Refresh workflow.
