name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy the current build or roll back to a previous release.
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - rollback
      rollback_release:
        description: Release directory name to roll back to. Leave blank to use the latest previous release.
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        if: inputs.action == 'deploy'
        run: pnpm install --frozen-lockfile=false

      - name: Build and validate
        if: inputs.action == 'deploy'
        run: |
          pnpm build:check
          pnpm html:validate
          node scripts/validate-bibtex.js
          node scripts/validate-security-headers.js
          node scripts/validate-sitemap.js

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.CERN_WEB_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.CERN_WEB_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy release with rollback point
        if: inputs.action == 'deploy'
        env:
          HOST: ${{ secrets.CERN_WEB_HOST }}
          USER: ${{ secrets.CERN_WEB_USER }}
          WEB_PATH: ${{ secrets.CERN_WEB_PATH }}
          RELEASE: ${{ github.run_id }}-${{ github.sha }}
        run: |
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "mkdir -p '$WEB_PATH/releases/$RELEASE' '$WEB_PATH/backups'"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "if [ -d '$WEB_PATH/current' ]; then cp -a '$WEB_PATH/current' '$WEB_PATH/backups/$(date +%Y%m%d%H%M%S)'; fi"
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "$USER@$HOST:$WEB_PATH/releases/$RELEASE/"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "ln -sfn '$WEB_PATH/releases/$RELEASE' '$WEB_PATH/current'"

      - name: Validate deployed security headers
        if: inputs.action == 'deploy'
        env:
          DEPLOY_URL: ${{ secrets.CERN_WEB_URL }}
        run: |
          if [ -n "$DEPLOY_URL" ]; then
            node scripts/validate-security-headers.js "$DEPLOY_URL"
          else
            echo "CERN_WEB_URL not set; skipped live security header validation."
          fi

      - name: Roll back release
        if: inputs.action == 'rollback'
        env:
          HOST: ${{ secrets.CERN_WEB_HOST }}
          USER: ${{ secrets.CERN_WEB_USER }}
          WEB_PATH: ${{ secrets.CERN_WEB_PATH }}
          ROLLBACK_RELEASE: ${{ inputs.rollback_release }}
        run: |
          if [ -z "$ROLLBACK_RELEASE" ]; then
            ROLLBACK_RELEASE=$(ssh -i ~/.ssh/deploy_key "$USER@$HOST" "find '$WEB_PATH/releases' -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort | tail -n 2 | head -n 1")
          fi
          test -n "$ROLLBACK_RELEASE"
          ssh -i ~/.ssh/deploy_key "$USER@$HOST" "test -d '$WEB_PATH/releases/$ROLLBACK_RELEASE' && ln -sfn '$WEB_PATH/releases/$ROLLBACK_RELEASE' '$WEB_PATH/current'"
