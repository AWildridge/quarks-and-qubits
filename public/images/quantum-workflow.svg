<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 360">
  <title id="title">Quantum-annealing primary-vertex reconstruction</title>
  <desc id="desc">Charged-particle tracks from two collision vertices are converted into track-pair compatibility weights, encoded in a QUBO matrix, embedded on an annealer, and decoded into vertex clusters.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1l8 4-8 4z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="24" y="24" width="672" height="312" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="60" y="56" font-size="16" font-weight="700">detector tracks</text>
    <text x="247" y="56" font-size="16" font-weight="700">pair weights</text>
    <text x="421" y="56" font-size="16" font-weight="700">QUBO + embedding</text>
    <text x="595" y="56" font-size="16" font-weight="700" text-anchor="middle">clusters</text>
  </g>

  <g stroke-linecap="round" stroke-linejoin="round">
    <circle cx="92" cy="178" r="8" fill="#f59e0b"/>
    <circle cx="118" cy="201" r="8" fill="#14b8a6"/>
    <path d="M92 178c-11-42-13-77-4-106" stroke="#f59e0b" stroke-width="3"/>
    <path d="M92 178c-41-10-63-29-68-57" stroke="#f59e0b" stroke-width="3"/>
    <path d="M92 178c-28 19-45 45-51 78" stroke="#f59e0b" stroke-width="3"/>
    <path d="M92 178c15-47 38-78 70-92" stroke="#f59e0b" stroke-width="3"/>
    <path d="M118 201c14-35 42-57 83-66" stroke="#14b8a6" stroke-width="3"/>
    <path d="M118 201c37 5 63 22 78 51" stroke="#14b8a6" stroke-width="3"/>
    <path d="M118 201c-12 36-11 64 2 84" stroke="#14b8a6" stroke-width="3"/>
    <path d="M118 201c-40 19-70 43-89 71" stroke="#14b8a6" stroke-width="3"/>
    <text x="78" y="165" font-family="Arial, sans-serif" font-size="13" fill="#92400e">v1</text>
    <text x="128" y="220" font-family="Arial, sans-serif" font-size="13" fill="#0f766e">v2</text>
  </g>

  <path d="M204 178h42" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(250 90)" stroke="#64748b" stroke-width="2">
    <line x1="42" y1="38" x2="104" y2="60"/>
    <line x1="42" y1="38" x2="65" y2="118"/>
    <line x1="104" y1="60" x2="65" y2="118"/>
    <line x1="104" y1="60" x2="142" y2="122"/>
    <line x1="65" y1="118" x2="142" y2="122"/>
    <line x1="42" y1="38" x2="142" y2="122" stroke="#ef4444" stroke-dasharray="5 5"/>
    <circle cx="42" cy="38" r="16" fill="#dcfce7" stroke="#15803d"/>
    <circle cx="104" cy="60" r="16" fill="#dcfce7" stroke="#15803d"/>
    <circle cx="65" cy="118" r="16" fill="#fef3c7" stroke="#b45309"/>
    <circle cx="142" cy="122" r="16" fill="#fef3c7" stroke="#b45309"/>
    <text x="93" y="169" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" fill="#475569" stroke="none">compatible and penalty terms</text>
  </g>

  <path d="M415 178h38" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(462 86)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="98" height="98" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <g stroke="#2563eb" stroke-width="1.3">
      <path d="M24.5 0v98M49 0v98M73.5 0v98M0 24.5h98M0 49h98M0 73.5h98"/>
    </g>
    <g fill="#1d4ed8">
      <rect x="26" y="2" width="21" height="21"/>
      <rect x="51" y="26" width="21" height="21"/>
      <rect x="76" y="51" width="20" height="21"/>
      <rect x="2" y="76" width="21" height="20"/>
    </g>
    <text x="49" y="124" text-anchor="middle" font-size="13" fill="#475569">objective matrix</text>
    <path d="M49 138c20 8 44 8 70 0" fill="none" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="51" cy="138" r="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="86" cy="144" r="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <circle cx="119" cy="138" r="7" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="85" y="170" text-anchor="middle" font-size="13" fill="#475569">hardware graph</text>
  </g>

  <path d="M590 178h28" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(625 95)" font-family="Arial, sans-serif">
    <ellipse cx="28" cy="50" rx="35" ry="42" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <ellipse cx="28" cy="146" rx="35" ry="42" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <g fill="#0f172a">
      <circle cx="11" cy="35" r="5"/>
      <circle cx="35" cy="48" r="5"/>
      <circle cx="44" cy="69" r="5"/>
      <circle cx="17" cy="146" r="5"/>
      <circle cx="40" cy="132" r="5"/>
      <circle cx="33" cy="166" r="5"/>
    </g>
    <text x="28" y="215" text-anchor="middle" font-size="13" fill="#475569">track-to-vertex assignment</text>
  </g>

  <text x="48" y="318" font-family="Arial, sans-serif" font-size="14" fill="#475569">The annealer searches over binary assignments; reconstruction quality depends on the objective and embedding overhead.</text>
</svg>
