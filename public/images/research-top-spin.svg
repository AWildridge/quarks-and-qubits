<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 520">
  <title id="title">From top-quark decays to spin correlations</title>
  <desc id="desc">The top quark has three final-state branches: a bottom quark, a positive lepton, and a neutrino. The antitop has an antibottom quark, a negative lepton, and an antineutrino. Intermediate W bosons are omitted. Lepton directions inform the three-by-three spin-correlation matrix, shown with symbolic entries, and a steering ellipsoid. No experimental data are plotted.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" fill="none" stroke="#13635b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="720" height="520" rx="16" fill="#eff2ed"/>
  <g font-family="system-ui, sans-serif" fill="#1c2a30">
    <text x="36" y="44" font-size="16" letter-spacing="2" fill="#4f6167">COLLIDER QUANTUM INFORMATION</text>

    <!-- Each circle has three outgoing final-state branches; the W decay is implicit. -->
    <path d="M24 185H80" stroke="#bbc9c0" stroke-width="3" stroke-dasharray="7 7"/>
    <path d="M54 185L100 118M54 185L100 248" fill="none" stroke="#bbc9c0" stroke-width="3"/>
    <circle cx="54" cy="185" r="6" fill="#b17c37"/>
    <g id="top-decay" transform="translate(0 -10)">
      <path d="M100 128L223 84" fill="none" stroke="#4f6167" stroke-width="2.5"/>
      <path d="M100 128H247" fill="none" stroke="#13635b" stroke-width="3.5"/>
      <path d="M100 128L223 172" fill="none" stroke="#4f6167" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle cx="100" cy="128" r="25" fill="#13635b"/>
      <text x="100" y="137" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-style="italic" fill="#ffffff">t</text>
      <g font-family="Georgia, serif" font-size="25" font-style="italic">
        <text x="235" y="92">b</text>
        <text x="258" y="136">ℓ⁺</text>
        <text x="235" y="180">ν</text>
      </g>
    </g>
    <g id="antitop-decay" transform="translate(0 6)">
      <path d="M100 242L223 198" fill="none" stroke="#4f6167" stroke-width="2.5"/>
      <path d="M100 242H247" fill="none" stroke="#685d81" stroke-width="3.5"/>
      <path d="M100 242L223 286" fill="none" stroke="#4f6167" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle cx="100" cy="242" r="25" fill="#685d81"/>
      <text x="100" y="251" text-anchor="middle" font-family="Georgia, serif" font-size="29" font-style="italic" fill="#ffffff"><tspan text-decoration="overline">t</tspan></text>
      <g font-family="Georgia, serif" font-size="25" font-style="italic">
        <text x="235" y="206"><tspan text-decoration="overline">b</tspan></text>
        <text x="258" y="250">ℓ⁻</text>
        <text x="235" y="294"><tspan text-decoration="overline">ν</tspan></text>
      </g>
    </g>
    <text x="36" y="328" font-size="23">Dilepton decays</text>

    <text x="364" y="152" text-anchor="middle" font-size="16" fill="#4f6167">Lepton</text>
    <text x="364" y="173" text-anchor="middle" font-size="16" fill="#4f6167">directions</text>
    <path d="M316 190H412" stroke="#13635b" stroke-width="2.5" marker-end="url(#arrow)"/>

    <!-- Symbolic matrix entries, with true subscripts and no implied measured values. -->
    <rect x="448" y="90" width="204" height="204" rx="9" fill="#fffef9"/>
    <path d="M450 96H438V288H450M650 96H662V288H650" fill="none" stroke="#13635b" stroke-width="2.5"/>
    <g font-family="Georgia, serif" font-size="28" font-style="italic" text-anchor="middle">
      <text x="482" y="132">C<tspan baseline-shift="sub" font-size="16" font-style="normal">11</tspan></text>
      <text x="550" y="132">C<tspan baseline-shift="sub" font-size="16" font-style="normal">12</tspan></text>
      <text x="618" y="132">C<tspan baseline-shift="sub" font-size="16" font-style="normal">13</tspan></text>
      <text x="482" y="200">C<tspan baseline-shift="sub" font-size="16" font-style="normal">21</tspan></text>
      <text x="550" y="200">C<tspan baseline-shift="sub" font-size="16" font-style="normal">22</tspan></text>
      <text x="618" y="200">C<tspan baseline-shift="sub" font-size="16" font-style="normal">23</tspan></text>
      <text x="482" y="268">C<tspan baseline-shift="sub" font-size="16" font-style="normal">31</tspan></text>
      <text x="550" y="268">C<tspan baseline-shift="sub" font-size="16" font-style="normal">32</tspan></text>
      <text x="618" y="268">C<tspan baseline-shift="sub" font-size="16" font-style="normal">33</tspan></text>
    </g>
    <text x="442" y="328" font-size="23">Spin correlations</text>

    <path d="M545 349V374H440" fill="none" stroke="#13635b" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="329" cy="414" r="77" fill="#fffef9" stroke="#b8c7bd" stroke-width="2"/>
    <ellipse cx="329" cy="414" rx="77" ry="23" fill="none" stroke="#b8c7bd" stroke-dasharray="5 5"/>
    <ellipse cx="329" cy="414" rx="59" ry="34" transform="rotate(-28 329 414)" fill="#a8d3c0" stroke="#13635b" stroke-width="2"/>
    <path d="M266 450L391 378M294 354L364 474" stroke="#13635b" stroke-width="1.4"/>
    <text x="36" y="400" font-size="23">Conditional</text>
    <text x="36" y="430" font-size="23">spin states</text>
    <text x="466" y="449" font-size="18" fill="#4f6167">Steering geometry</text>
    <text x="466" y="480" font-size="15" fill="#4f6167">Schematic · no measured data</text>
  </g>
</svg>
