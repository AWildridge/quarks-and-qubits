<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 360">
  <title id="title">Top-quark spin-correlation workflow</title>
  <desc id="desc">Collision events flow into reconstructed leptons and then into a three by three spin-correlation matrix.</desc>
  <rect width="720" height="360" fill="#f8fafc"/>
  <g fill="none" stroke="#1d4ed8" stroke-width="6" stroke-linecap="round">
    <path d="M80 180h135"/>
    <path d="M505 180h135"/>
    <path d="M220 180c55-85 115-85 170 0"/>
    <path d="M220 180c55 85 115 85 170 0"/>
  </g>
  <g fill="#0f172a">
    <circle cx="80" cy="180" r="18"/>
    <circle cx="215" cy="180" r="18"/>
    <circle cx="505" cy="180" r="18"/>
    <circle cx="640" cy="180" r="18"/>
  </g>
  <g transform="translate(300 92)">
    <rect width="120" height="120" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/>
    <path d="M40 0v120M80 0v120M0 40h120M0 80h120" stroke="#1d4ed8" stroke-width="2"/>
  </g>
  <text x="360" y="250" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#0f172a">C_ij observables</text>
</svg>
