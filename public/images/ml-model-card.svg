<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 360">
  <title id="title">Particle-physics foundation model evaluation</title>
  <desc id="desc">Detector events are tokenized and embedded by a foundation model. Downstream anomaly scores, physics metrics, shifted samples, and model-card documentation close the evaluation loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1l8 4-8 4z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="720" height="360" fill="#f8fafc"/>
  <rect x="24" y="24" width="672" height="312" rx="10" fill="#ffffff" stroke="#cbd5e1"/>

  <g font-family="Arial, sans-serif" fill="#0f172a">
    <text x="58" y="58" font-size="16" font-weight="700">collision events</text>
    <text x="256" y="58" font-size="16" font-weight="700">representation model</text>
    <text x="498" y="58" font-size="16" font-weight="700">physics evaluation</text>
  </g>

  <g transform="translate(54 86)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="58" cy="88" r="54" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
    <path d="M58 88l-42-24M58 88l37-37M58 88l48 14M58 88l-18 46M58 88l-53 15" stroke="#0e7490" stroke-width="3"/>
    <circle cx="16" cy="64" r="5" fill="#0f172a"/>
    <circle cx="95" cy="51" r="5" fill="#0f172a"/>
    <circle cx="106" cy="102" r="5" fill="#0f172a"/>
    <circle cx="40" cy="134" r="5" fill="#0f172a"/>
    <circle cx="5" cy="103" r="5" fill="#0f172a"/>
    <path d="M15 176h92" stroke="#94a3b8" stroke-width="2"/>
    <rect x="18" y="194" width="21" height="28" fill="#38bdf8"/>
    <rect x="45" y="184" width="21" height="38" fill="#14b8a6"/>
    <rect x="72" y="167" width="21" height="55" fill="#f59e0b"/>
    <text x="58" y="247" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#475569">jets, tracks, leptons, missing energy</text>
  </g>

  <path d="M183 178h50" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(248 86)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="176" height="184" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <g fill="#7c3aed" opacity="0.25">
      <rect x="18" y="22" width="28" height="28" rx="4"/>
      <rect x="56" y="22" width="28" height="28" rx="4"/>
      <rect x="94" y="22" width="28" height="28" rx="4"/>
      <rect x="132" y="22" width="28" height="28" rx="4"/>
    </g>
    <text x="88" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#4c1d95">shared event embedding</text>
    <path d="M28 104h120M28 126h120M28 148h120" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="38" cy="104" r="6" fill="#f59e0b"/>
    <circle cx="83" cy="126" r="6" fill="#14b8a6"/>
    <circle cx="137" cy="148" r="6" fill="#2563eb"/>
    <text x="88" y="213" text-anchor="middle" font-size="13" fill="#475569">pretraining separates representation from tasks</text>
  </g>

  <path d="M432 178h44" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(488 82)" font-family="Arial, sans-serif">
    <rect x="0" y="0" width="172" height="70" rx="7" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
    <text x="18" y="27" font-size="15" font-weight="700" fill="#14532d">anomaly scores</text>
    <path d="M20 50c28 4 48 3 62-3s28-10 45-5 25 2 30-10" fill="none" stroke="#16a34a" stroke-width="3"/>

    <rect x="0" y="88" width="172" height="70" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="18" y="115" font-size="15" font-weight="700" fill="#7c2d12">shifted samples</text>
    <circle cx="37" cy="139" r="9" fill="#fed7aa"/>
    <circle cx="69" cy="139" r="9" fill="#fdba74"/>
    <circle cx="101" cy="139" r="9" fill="#fb923c"/>
    <circle cx="133" cy="139" r="9" fill="#f97316"/>

    <rect x="0" y="176" width="172" height="70" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="18" y="202" font-size="15" font-weight="700" fill="#172554">model card</text>
    <path d="M20 221h66M20 237h126" stroke="#2563eb" stroke-width="3"/>
  </g>

  <path d="M574 257c-96 66-241 63-334 5" fill="none" stroke="#64748b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <text x="48" y="318" font-family="Arial, sans-serif" font-size="14" fill="#475569">Evaluation links learned representations to benchmark tasks, systematic shifts, and stated limits of use.</text>
</svg>
